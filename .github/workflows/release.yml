name: Release

# CD：推送 v* 标签时，自动构建各平台基础安装包并发布到 GitHub Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: create release from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 已存在（例如重跑）时跳过，后续步骤会向既有 release 上传
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenReadest $GITHUB_REF_NAME" \
            --generate-notes || true

  build:
    needs: prepare-release
    name: ${{ matrix.config.name }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: android, os: ubuntu-latest, rust_target: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' }
          - { name: linux, os: ubuntu-22.04, rust_target: x86_64-unknown-linux-gnu }
          - { name: macos, os: macos-latest, rust_target: 'x86_64-apple-darwin,aarch64-apple-darwin', args: '--target universal-apple-darwin --no-sign' }
          - { name: windows-x86_64, os: windows-latest, rust_target: x86_64-pc-windows-msvc, args: '--target x86_64-pc-windows-msvc --bundles nsis' }
          - { name: windows-aarch64, os: windows-latest, rust_target: aarch64-pc-windows-msvc, args: '--target aarch64-pc-windows-msvc --bundles nsis' }
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # Android 专属工具链
      - uses: actions/setup-java@v5
        if: matrix.config.name == 'android'
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.config.name == 'android'
      - name: install NDK
        if: matrix.config.name == 'android'
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install
      - name: copy vendored frontend assets
        run: pnpm --filter @openreadest/app setup-vendors

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.name }}-cargo

      - name: install Linux dependencies
        if: contains(matrix.config.os, 'ubuntu') && matrix.config.name != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: create .env.local for Next.js
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/openreadest-app/.env.local

      # 桌面平台：tauri-action 负责构建并上传到 release
      - uses: tauri-apps/tauri-action@v0
        if: matrix.config.name != 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        with:
          projectPath: apps/openreadest-app
          tagName: ${{ github.ref_name }}
          releaseName: OpenReadest ${{ github.ref_name }}
          args: ${{ matrix.config.args || '' }}

      # Android：重建 gen 工程并上传未签名 universal APK
      - name: build and upload Android APK
        if: matrix.config.name == 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/openreadest-app
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          rm -rf src-tauri/gen/android
          pnpm tauri android init

          version="${GITHUB_REF_NAME#v}"
          apk="OpenReadest_${version}_universal.apk"
          pnpm tauri android build
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk "$apk"
          gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
